[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-assistant"
version = "0.1.0"
description = "Local-first personal knowledge base with hybrid search and RAG Q&A"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.11.5",
    "pydantic-settings==2.9.1",
    "sqlalchemy==2.0.41",
    "alembic==1.16.1",
    "sqlite-vec==0.1.6",
    "fastembed==0.7.0",
    "pymupdf==1.26.0",
    "pymupdf4llm==0.0.24",
    "typer==0.16.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
]

[project.optional-dependencies]
ollama = ["ollama==0.5.1"]
openai = ["openai==1.82.1"]
anthropic = ["anthropic==0.52.1"]
docling = ["docling==2.34.0"]
all = ["ollama==0.5.1", "openai==1.82.1", "anthropic==0.52.1"]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0"]

[project.scripts]
ka = "knowledge_assistant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge_assistant = ["static/**/*", "alembic.ini", "migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

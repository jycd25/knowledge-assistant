[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-assistant"
version = "0.1.0"
description = "Local-first personal knowledge base with hybrid search and RAG Q&A"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "sqlalchemy==2.0.40",
    "alembic==1.15.2",
    "sqlite-vec==0.1.6",
    "fastembed==0.6.1",
    "pymupdf==1.25.5",
    "pymupdf4llm==0.0.22",
    "typer==0.15.2",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
]

[project.optional-dependencies]
ollama = ["ollama==0.4.8"]
openai = ["openai==1.76.0"]
anthropic = ["anthropic==0.50.0"]
docling = ["docling==2.31.0"]
all = ["ollama==0.4.8", "openai==1.76.0", "anthropic==0.50.0"]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0"]

[project.scripts]
ka = "knowledge_assistant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge_assistant = ["static/**/*", "alembic.ini", "migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
